  "en": {
    "eyebrow": "SimpleBooking · Booking Engine × Back Office",
    "title": "29 questions that connect demand and sales",
    "lede": "An AI assistant connected at the same time to the Booking Engine (area demand, availability, prices) and the Back Office (searches on your own engine and actual bookings) can answer questions neither of them can resolve alone: whether the market is there and you are not converting it, whether it isn't finding you at all, or whether you are turning requests away without knowing. 29 examples, organized by topic.",
    "pillCount": "29 questions",
    "pillCats": "9 categories",
    "pillSource": "Booking Engine + Back Office SimpleBooking",
    "setupLabel": "Say this first",
    "setupPrompt": "We are working on {{HOTEL NAME}}, property {{PROPERTY_ID}}. For every question that follows, keep both the Booking Engine and the Back Office of this property connected, without asking me again. Area demand is calculated at the destination level, not for this specific property: whenever that matters for interpreting an answer, state it. If a question needs a period: when it is not clear and cannot be inferred from context, ask me before answering instead of guessing; if a reasonable default exists, go ahead and use it, but always state in the answer which period you used.",
    "setupNote": "Replace the two placeholders with your property — if you do not know the Property ID you can leave it blank, the assistant will ask or look it up itself. From here on, none of the questions repeat the property.",
    "caveatText": "<b>Worth keeping in mind:</b> two different measures of demand sit side by side here. <i>Area</i> demand measures searches for the destination, not for your property — nearby hotels see the same number. Demand <i>on your own booking engine</i>, by contrast, is yours alone. The two do not add up and cannot be compared in absolute values: what you compare is how they move, and it is exactly that comparison that tells you whether the market isn't reaching you, or is reaching you and not buying. The ratio between searches and bookings remains an indicator, not an attribution: there is no link between an individual search and an individual booking.",
    "indexLabel": "Categories",
    "copy": "Copy",
    "copied": "Copied",
    "followTag": "Then you can ask",
    "foot": "This catalog comes with the sb-demand-capture skill, which orchestrates sb-revenue-lens (Booking Engine) and sb-reservation-insights (Back Office) without recomputing their logic. It is a v1, not yet validated on real data: verify the results on a real property before using it with a client. The answers will always use your own property's data — the examples above are just the questions. For more information, contact your SimpleBooking representative.",
    "version": "Version 1.1 — September 11, 2026",
    "copyright": "© 2025-2026 SimpleBooking — Zucchetti Group. All rights reserved.",
    "cats": [
      {
        "t": "Demand vs actual sales",
        "code": "DS",
        "why": "Area demand tells you how much the market searches for your destination; the Back Office tells you how much you are really selling. Put together, you find out whether the problem is the market or you.",
        "qs": [
          {
            "n": "DS-1",
            "q": "Is area demand growing or falling this month compared with last month? Does my on-the-books follow the same trend?",
            "fu": [
              "If both fall together that's normal seasonality: where am I instead losing ground against the market?"
            ]
          },
          {
            "n": "DS-2",
            "q": "Over the next three weeks, how much area demand was there compared with the bookings I actually picked up?"
          },
          {
            "n": "DS-3",
            "q": "Over the last 12 months, has my revenue followed the seasonality of area demand, or have I moved against it?"
          },
          {
            "n": "DS-4",
            "q": "Which weeks of next quarter have the highest area demand, and where do I stand with on-the-books for those same weeks?"
          }
        ]
      },
      {
        "t": "Why am I not converting",
        "code": "NC",
        "why": "When demand exists but real bookings don't, the problem is almost always downstream: a restriction, a closure, a price. Here you check it line by line.",
        "qs": [
          {
            "n": "NC-1",
            "q": "On a date with high area demand but very few real bookings, is it the minimum stay, closed availability, or the price?"
          },
          {
            "n": "NC-2",
            "q": "Which high-demand nights show up as \"not bookable\" on the availability calendar?",
            "fu": [
              "Of those nights, how many were already closed a week earlier?"
            ]
          },
          {
            "n": "NC-3",
            "q": "Applied to future demand, not just to booked history, how many searches does my current minimum stay risk turning away?"
          },
          {
            "n": "NC-4",
            "q": "Do the dates where I get the most single-night stays also show area demand concentrated on short stays?"
          }
        ]
      },
      {
        "t": "Price and channel parity",
        "code": "PP",
        "why": "The price you actually sell on a portal and the one your booking engine shows in parity should match. When they don't, someone else is profiting, not you.",
        "qs": [
          {
            "n": "PP-1",
            "q": "Does my real ADR on Booking.com match the price my booking engine shows in OTA parity for the same dates?"
          },
          {
            "n": "PP-2",
            "q": "Are there dates where the price shown on my booking engine is higher than what I actually sell on OTAs?"
          },
          {
            "n": "PP-3",
            "q": "Is a channel gaining share because my direct price doesn't hold up against market demand?"
          }
        ]
      },
      {
        "t": "Product and catalog vs demand",
        "code": "PC",
        "why": "Packages, offers and room types should chase demand, not the other way around. Here you check whether your catalog really covers what the market is looking for.",
        "qs": [
          {
            "n": "PC-1",
            "q": "Do the packages in my catalog really intercept the peak periods of area demand?"
          },
          {
            "n": "PC-2",
            "q": "Do the offers active right now coincide with periods of weak demand? Are they working?"
          },
          {
            "n": "PC-3",
            "q": "Is there a demand segment — families, couples, business travellers — visible in area demand that my room catalog doesn't cover well?"
          }
        ]
      },
      {
        "t": "Markets and segments: who searches vs who books",
        "code": "MS",
        "why": "Area demand is segmented by origin, party composition and device. Compared with who actually books, it shows where you are leaving a market uncovered.",
        "qs": [
          {
            "n": "MS-1",
            "q": "Which countries does area demand for my destination come from, and does it match the source markets of my real guests?",
            "fu": [
              "Is there a foreign market visible in demand but almost absent from my bookings?"
            ]
          },
          {
            "n": "MS-2",
            "q": "Do families with children search for my destination more than they actually book with me?"
          },
          {
            "n": "MS-3",
            "q": "Does the device the market searches with (mobile or desktop) match that of my direct bookers?"
          }
        ]
      },
      {
        "t": "Booking window and pacing",
        "code": "BW",
        "why": "Knowing how far ahead the market searches for these dates, not just how far ahead you sell, tells you when the right moment is to open prices and packages.",
        "qs": [
          {
            "n": "BW-1",
            "q": "Is my real selling lead time consistent with how far ahead the market searches for these same dates?"
          },
          {
            "n": "BW-2",
            "q": "Based on when the market starts searching for a period, should I open sales for a package or an offer earlier?"
          },
          {
            "n": "BW-3",
            "q": "For the last quarter of the year, is long-lead-time area demand already outpacing my on-the-books for the same period?"
          }
        ]
      },
      {
        "t": "Multi-property portfolio",
        "code": "MP",
        "why": "If you manage more than one hotel in the same area or in different areas, here you compare who is really capturing the demand of their own destination.",
        "qs": [
          {
            "n": "MP-1",
            "q": "Which property in the group converts its own destination's area demand into real bookings best?"
          },
          {
            "n": "MP-2",
            "q": "At equal area demand in the same city, which hotel in the portfolio sells better, and at what ADR?"
          },
          {
            "n": "MP-3",
            "q": "Between two properties with similar area demand, which has the stricter minimum stay, and does it show in the sales gap?"
          }
        ]
      },
      {
        "t": "Do they find me? Property visibility",
        "code": "PV",
        "why": "Between the destination's demand and your sales there is a step that used to be invisible: how many of those searches actually reach your booking engine. If the market grows and traffic on your engine doesn't, the problem sits upstream of your rates.",
        "qs": [
          {
            "n": "PV-1",
            "q": "Compared with a year ago, have searches on my booking engine grown as much as my destination's demand?",
            "fu": [
              "If the destination grew and I didn't, how many percentage points behind am I?"
            ]
          },
          {
            "n": "PV-2",
            "q": "Is my sales drop coming from fewer people finding me, or from fewer people buying once they have?"
          },
          {
            "n": "PV-3",
            "q": "Which devices and countries search for me, and does that look like who searches the destination as a whole?"
          }
        ]
      },
      {
        "t": "Requests I turned away",
        "code": "RT",
        "why": "Every time a guest sets dates and guests and the engine has nothing to offer, that request is recorded. It is the only way to see demand you lost without noticing — and the breakdown tells you whether it was genuinely sold out, one of your own rules, or how the rooms are configured.",
        "qs": [
          {
            "n": "RT-1",
            "q": "How many searches on my booking engine found no solution at all last month, and what share of the total is that?",
            "fu": [
              "Which check-in dates do they cluster on?"
            ]
          },
          {
            "n": "RT-2",
            "q": "Were the requests I turned away short stays on dates with a minimum stay active, or dates that were genuinely sold out?"
          },
          {
            "n": "RT-3",
            "q": "Is there a guest composition — couples, families, triples — that I turn away far more than the others while still having rooms free?"
          }
        ]
      }
    ]
  },
  "de": {

    "pillCount": "29 Fragen",

    "pillSource": "Booking Engine + Back Office SimpleBooking",
    "setupLabel": "Das zuerst einfügen",
    "setupPrompt": "Wir arbeiten an {{HOTELNAME}}, Property {{PROPERTY_ID}}. Halten Sie für alle folgenden Fragen sowohl die Booking Engine als auch das Back Office dieser Unterkunft verbunden, ohne mich erneut danach zu fragen. Die Gebietsnachfrage wird auf Ebene der Destination berechnet, nicht für die einzelne Unterkunft: Geben Sie das immer an, wenn es für die Interpretation der Antwort relevant ist. Wenn eine Frage einen Zeitraum benötigt: Fragen Sie mich, wenn er nicht klar ist und sich nicht aus dem Kontext ableiten lässt, statt zu raten; wenn ein sinnvoller Standardwert existiert, verwenden Sie ihn, aber geben Sie immer an, welchen Zeitraum Sie verwendet haben.",
    "setupNote": "Ersetzen Sie die beiden Platzhalter durch Ihre Unterkunft — wenn Sie die Property-ID nicht kennen, können Sie sie leer lassen, der Assistent fragt danach oder sucht sie selbst. Ab hier wiederholt keine der Fragen mehr die Property.",
    "caveatText": "<b>Bitte beachten:</b> Hier stehen zwei unterschiedliche Nachfragemaße nebeneinander. Die <i>Gebietsnachfrage</i> misst die Suchanfragen nach der Destination, nicht nach Ihrem Haus — benachbarte Hotels sehen dieselbe Zahl. Die Nachfrage <i>auf Ihrer eigenen Booking Engine</i> gehört dagegen allein Ihnen. Beide lassen sich weder addieren noch in absoluten Werten vergleichen: Verglichen werden ihre Veränderungen, und genau dieser Vergleich zeigt, ob der Markt Sie nicht erreicht oder ob er Sie erreicht und nicht kauft. Das Verhältnis von Suchanfragen zu Buchungen bleibt ein Indikator, keine Attribution: Zwischen einer einzelnen Suche und einer einzelnen Buchung besteht keine Verbindung.",
    "indexLabel": "Kategorien",
    "copy": "Kopieren",

    "followTag": "Dann können Sie fragen",

            ]
          },
          {
            "n": "PV-2",
            "q": "Kommt mein Verkaufsrückgang daher, dass mich weniger Menschen finden, oder daher, dass weniger Menschen kaufen, nachdem sie mich gefunden haben?"
          },
          {
            "n": "PV-3",
            "q": "Von welchen Endgeräten und aus welchen Ländern wird nach mir gesucht, und ähnelt das denen, die nach der Destination insgesamt suchen?"
          }
        ]
      },
      {
        "t": "Anfragen, die ich abweisen musste",
        "code": "RT",
        "why": "Jedes Mal, wenn ein Gast Termine und Personenzahl eingibt und die Booking Engine nichts anzubieten hat, wird diese Anfrage protokolliert. Das ist die einzige Möglichkeit, die Nachfrage zu sehen, die Sie unbemerkt verloren haben — und die Aufschlüsselung sagt Ihnen, ob wirklich ausgebucht war, ob eine Ihrer eigenen Regeln gegriffen hat oder wie die Zimmer konfiguriert sind.",
        "qs": [
          {
            "n": "RT-1",
            "q": "Wie viele Suchanfragen auf meiner Booking Engine haben im letzten Monat überhaupt keine Lösung gefunden, und welchen Anteil am Gesamtvolumen machen sie aus?",
            "fu": [
              "Auf welche Anreisetermine konzentrieren sie sich?"
            ]
          },
          {
            "n": "RT-2",
            "q": "Waren die Anfragen, die ich abweisen musste, Kurzaufenthalte an Terminen mit aktivem Mindestaufenthalt, oder waren die Termine wirklich ausgebucht?"
          },
          {
            "n": "RT-3",
            "q": "Gibt es eine Gästekonstellation — Paare, Familien, Dreibettbelegungen —, die ich weit häufiger abweise als die übrigen, obwohl ich noch freie Zimmer habe?"
          }
        ]
      }
    ]
  }
};

let lang = "it";

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function copyButton(getText, cls) {
  const b = el("button", cls || "copy", DATA[lang].copy);
  b.type = "button";
  b.addEventListener("click", async () => {
    const text = getText();
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = el("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    b.textContent = DATA[lang].copied;
    b.dataset.done = "1";
    setTimeout(() => { b.textContent = DATA[lang].copy; delete b.dataset.done; }, 1400);
  });
  return b;
}

function render() {
  const d = DATA[lang];
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-t]").forEach(n => {
    if (n.dataset.t === "caveatText") { n.innerHTML = d[n.dataset.t]; }
    else { n.textContent = d[n.dataset.t]; }
  });
  document.querySelectorAll("[data-t-label]").forEach(n => { n.textContent = d[n.dataset["tLabel"]]; });

  const setupBtn = document.querySelector('[data-copy="setupPrompt"]');
  const fresh = copyButton(() => DATA[lang].setupPrompt);
  setupBtn.replaceWith(fresh);
  fresh.dataset.copy = "setupPrompt";

  const cats = document.getElementById("cats");
  const index = document.getElementById("index");
  cats.replaceChildren();
  index.replaceChildren();

  d.cats.forEach((c, ci) => {
    const id = "cat-" + c.code.toLowerCase();

    const li = el("li");
    const a = el("a");
    a.href = "#" + id;
    a.appendChild(el("span", "n", c.code));
    a.appendChild(el("span", null, c.t));
    li.appendChild(a);
    index.appendChild(li);

    const sec = el("section", "cat");
    sec.id = id;

    const head = el("div", "cat-head");
    head.appendChild(el("div", "kicker", c.code));
    head.appendChild(el("h2", null, c.t));
    head.appendChild(el("p", "why", c.why));
    sec.appendChild(head);

    const ol = el("ol", "qs");
    c.qs.forEach(item => {
      const q = el("li", "q");
      const row = el("div", "qgrid");
      const rowBtn = copyButton(() => item.q);
      row.appendChild(el("div", "qnum", String(item.n)));
      row.appendChild(el("div", "qtext2", item.q));
      row.appendChild(rowBtn);
      row.addEventListener("click", (e) => {
        if (e.target.closest(".copy")) return;
        rowBtn.click();
      });
      q.appendChild(row);

      if (item.fu && item.fu.length) {
        const fu = el("div", "fu");
        item.fu.forEach(f => {
          const w = el("div", "fu-item");
          const t = el("div", "t", f);
          t.dataset.tag = d.followTag;
          const wBtn = copyButton(() => f);
          w.appendChild(t);
          w.appendChild(wBtn);
          w.addEventListener("click", (e) => {
            if (e.target.closest(".copy")) return;
            wBtn.click();
          });
          fu.appendChild(w);
        });
        q.appendChild(fu);
      }
      ol.appendChild(q);
    });
    sec.appendChild(ol);

    cats.appendChild(sec);
  });

  document.querySelectorAll("[data-lang]").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });
}

document.querySelectorAll("[data-lang]").forEach(b => {
  b.addEventListener("click", () => { lang = b.dataset.lang; render(); });
});

render();
</script>
