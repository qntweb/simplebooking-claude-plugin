# sb-demand-capture — defaults and thresholds
#
# This skill does NOT own a hotel->Property ID mapping: both sb-revenue-lens
# (config/defaults.yaml:known_hotels) and sb-reservation-insights already resolve
# the name reliably. Duplicating it here would create a third copy to keep in sync.
# Pass the same name/ID to both invocations, don't resolve it yourself.

# ---------------------------------------------------------------------------
# Demand radius — REQUIRED, NEVER omitted
# ---------------------------------------------------------------------------
# `property_destination_demands_run_report` declares radius_km as a required
# parameter, and NEITHER the tool's schema NOR `destination_get_report_options`
# expose a system default. Omitting it or passing 0 produces undocumented
# behavior (a test with radius_km=0 was silently rewritten to 2 km by the
# tool). Always use one of these explicit values — inherit the same
# convention as sb-revenue-lens (config/defaults.yaml:radius_km), don't invent
# a third one — and use **the same radius on both sides of a YoY
# comparison**: different radii between "this year" and "a year ago" make the
# computed delta meaningless.
radius_km:
  urban_default: 12
  coastal_resort: 20
  rural_default: 25

# ---------------------------------------------------------------------------
# Default period when the user doesn't specify one
# ---------------------------------------------------------------------------
default_window:
  weeks: 6
  note: >
    Length of the analyzed period when the user doesn't specify one — not a
    "6 weeks ahead to compare week over week" horizon (see the warning below:
    that comparison isn't valid). It's the window that then always gets
    doubled into a "this year / same window a year ago" pair for any lens
    that reads a demand trend (X1, X4, X6, X7).

# ---------------------------------------------------------------------------
# WARNING — demand for consecutive weeks ahead is NOT a readable
# week-over-week trend
# ---------------------------------------------------------------------------
# `search_period_from/to` defaults to always covering the last 91 days BEFORE
# TODAY, regardless of the requested stay week (`stay_date_from/to`). As a
# result, the demand count for stay weeks progressively further in the future
# DECLINES almost mechanically, because a more distant date has simply
# accumulated fewer searches within the same fixed observation window — not
# because the market is cooling off. Comparing week N to week N+1 of the same
# snapshot, as X1's original spec assumed, confuses this artifact with a real
# signal.
#
# The valid reading is the one already used and validated by sb-monday-brief
# (Detector 1): same stay window, a year ago vs today (demand) — shifting
# search_period_from/to together with stay_date_from/to by 364 days, not 365
# (keeps Monday-Sunday alignment) — against actual OTB vs STLY (booked within
# the snapshot from a year ago minus canceled within that same snapshot). See
# references/orchestration.md and references/cross-lenses.md, section X1, for
# the full method and a verified real example checked with scripts/verify.py.

# ---------------------------------------------------------------------------
# Gap classification thresholds (lenses X1, X3, X6) — percentage points of
# difference between the growth/change rate on the demand side and the
# actual sales side
# ---------------------------------------------------------------------------
gap_thresholds:
  aligned_pp: 5     # |delta| <= 5pp -> "in line with the market"
  notable_pp: 15    # 5pp < |delta| <= 15pp -> "deviation to verify"
                     # |delta| > 15pp -> "marked deviation" (flag the evidence, not the cause)

# ---------------------------------------------------------------------------
# Minimum base for a sales-side delta % (X1/X3/X6)
# ---------------------------------------------------------------------------
# A small STLY base can produce a percentage that's arithmetically correct
# but practically meaningless — the swing of a handful of reservations. Below
# this threshold, `scripts/verify.py` doesn't block the calculation but warns:
# always report the absolute counts alongside the percentage, never the
# percentage alone.
min_gap_base_n: 20

# ---------------------------------------------------------------------------
# Year-over-year stability of the actual/demand ratio (X6 only)
# ---------------------------------------------------------------------------
# X6 compares the YoY delta of two averages (demand's daysAhead, actual
# DaysInAdvance) instead of the absolute value, because the two populations
# aren't comparable in absolute terms (searches vs confirmed reservations —
# see references/cross-lenses.md). The method assumes the RATIO between the
# two averages stays stable over time. Above this drift threshold,
# `scripts/verify.py` warns that the computed gap is a hypothesis to verify
# with the hotelier, not a confirmed reading.
max_ratio_drift_pct: 15

# ---------------------------------------------------------------------------
# Double basis for the gap (RoomNights vs reservationsCount)
# ---------------------------------------------------------------------------
# The RoomNights basis and the reservationsCount basis can classify the same
# week two different ways ("to verify" vs "marked deviation") — a change in
# the average size of reservations (more/fewer rooms or nights per
# reservation) is enough to make them diverge. Always compute both bases for
# X1/X3/X6 and pass `other_basis_classification` to `scripts/verify.py`: if
# they disagree, report both in the answer instead of silently picking one.

# ---------------------------------------------------------------------------
# Minimum coverage of a Back Office field before reading its comparison
# (lens X5 — markets/segments). Same warning threshold that
# sb-reservation-insights applies to its own distributions.
# ---------------------------------------------------------------------------
min_field_coverage: 0.25
